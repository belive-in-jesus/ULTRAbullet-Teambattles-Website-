name: UltraBullet Team Battles Leaderboard

on:
  workflow_dispatch:
    inputs:
      lichess_user:
        description: "Lichess username that created the battles"
        required: false
        default: "Nathanael01"
      name_filters:
        description: "Comma-separated name filters (case-insensitive)"
        required: false
        default: "ultrabullet"
      request_delay:
        description: "Seconds to wait between sequential Lichess API requests"
        required: false
        default: "1.0"
      force_refresh_all:
        description: "Re-fetch every cached battle (slow; use for a full audit only)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "15 6,18 * * *"
      timezone: "Europe/Berlin"

permissions:
  contents: write

concurrency:
  group: leaderboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install -r requirements.txt

      - name: Validate scripts and aggregation tests
        run: |
          python -m py_compile scripts/discover.py scripts/update_battle_cache.py scripts/cache_to_partials.py scripts/aggregate.py scripts/tests/test_aggregate.py scripts/tests/test_incremental_cache.py
          python -m unittest discover -s scripts/tests -v

      - name: Discover finished matching tournaments
        env:
          LICHESS_USER: ${{ inputs.lichess_user || vars.LICHESS_USER || 'Nathanael01' }}
          NAME_FILTERS: ${{ inputs.name_filters || vars.NAME_FILTERS || 'ultrabullet' }}
          DISCOVER_NB: ${{ vars.DISCOVER_NB || '6000' }}
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: python scripts/discover.py

      - name: Update persistent battle cache (one API request at a time)
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
          REQUEST_DELAY: ${{ inputs.request_delay || '1.0' }}
          FORCE_REFRESH_ALL: ${{ inputs.force_refresh_all || 'false' }}
          BATTLE_CACHE_DIR: docs/data/battle_cache
          BATTLE_REPORT_DIR: docs/data/battles
        run: python scripts/update_battle_cache.py

      - name: Build aggregate input from cached battles
        env:
          BATTLE_CACHE_DIR: docs/data/battle_cache
          PARTIALS_DIR: artifacts
        run: python scripts/cache_to_partials.py

      - name: Rebuild cumulative rankings and analytics
        env:
          NAME_FILTERS: ${{ inputs.name_filters || vars.NAME_FILTERS || 'ultrabullet' }}
          PARTIALS_DIR: artifacts
          OUTPUT_DIR: docs/data
        run: python scripts/aggregate.py

      - name: Upload failed processing report
        if: failure() && hashFiles('errors.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-errors
          path: errors.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload processing report
        if: always() && hashFiles('docs/data/meta.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-report
          path: |
            docs/data/leaderboard_players.json
            docs/data/leaderboard_teams.json
            docs/data/contributors.json
            docs/data/meta.json
            docs/data/battle_history.json
            docs/data/periods_index.json
            docs/data/hall_of_fame.json
            docs/data/analytics/
            docs/data/periods/
            docs/data/profiles/
            docs/data/battles/
            docs/data/battle_cache/
          if-no-files-found: warn
          retention-days: 7

      - name: Commit refreshed website data
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          generated_dir="$RUNNER_TEMP/leaderboard-generated-data"
          rm -rf "$generated_dir"
          mkdir -p "$generated_dir"
          cp -a docs/data/. "$generated_dir/"

          # Retry push conflicts without discarding site or workflow commits.
          for attempt in 1 2 3; do
            echo "Publishing leaderboard data (attempt $attempt/3)"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p docs/data
            cp -a "$generated_dir/." docs/data/
            git add docs/data

            if git diff --cached --quiet; then
              echo "Leaderboard data is already up to date."
              exit 0
            fi

            git commit -m "Refresh UltraBullet leaderboard data"
            if git push origin HEAD:main; then
              echo "Leaderboard data published successfully."
              exit 0
            fi

            echo "Push was rejected because main moved; syncing and retrying."
            sleep "$((attempt * 2))"
          done

          echo "Could not publish leaderboard data after 3 attempts." >&2
          exit 1
