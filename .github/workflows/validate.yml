name: Validate leaderboard project

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python scripts
        run: |
          python -m py_compile scripts/discover.py scripts/fetch_worker.py scripts/aggregate.py scripts/tests/test_aggregate.py
      - name: Run aggregation tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Check browser JavaScript syntax
        run: |
          node --check docs/js/analytics.js
          node --check docs/js/profile.js
          node --check docs/js/achievements.js
          node --check docs/js/dashboard-analytics.js
      - name: Run analytics regression tests
        run: node --test scripts/tests/test_analytics.js scripts/tests/test_profile_integration.js scripts/tests/test_dashboard_analytics.js
